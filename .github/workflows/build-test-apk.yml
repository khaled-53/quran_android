name: Build test APK

on:
  push:
    branches:
      - feature/ashraf-prayer-reminder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleMadaniDebug -PdisableFirebase

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-mushaf-al-shareef-test-apk
          path: app/build/outputs/apk/madani/debug/app-madani-debug.apk
          if-no-files-found: error
          retention-days: 7
